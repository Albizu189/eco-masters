name: Test and release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Godot 4.4.1
        run: |
          curl --http1.1 -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run rules tests
        run: |
          "$GODOT_BIN" --headless --path . --editor --import --quit
          "$GODOT_BIN" --headless --path . --script res://tests/test_rules.gd
      - name: Build APK
        run: bash scripts/build-android.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoMasters-APK
          path: build/EcoMasters.apk
      - name: Update downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Eco Masters for Android
          body: |
            Download **EcoMasters.apk**, allow installation from this source on your Android device, and install.
            Android 7.0 or newer is required. This direct-install build is signed with the Android debug certificate.
            For Play Store distribution, create and protect your own release signing key.
          files: build/EcoMasters.apk
          generate_release_notes: true
